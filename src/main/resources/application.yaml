
spring:
  datasource:
    # CORRIGIDO: O Spring Boot agora injeta a DATABASE_URL dentro do formato JDBC correto
    url: jdbc:${DATABASE_URL:${spring.datasource.url}}
    # Remova as linhas antigas de username e password daqui, pois a DATABASE_URL já contém os dois embutidos!
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
