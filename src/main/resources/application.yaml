spring:
  datasource:
    # Estrutura limpa de produção que monta o link sem duplicar o protocolo
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.postgresql.dialect.PostgreSQLDialect
